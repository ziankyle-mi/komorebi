<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#181d2c"/>
      <stop offset="60%" stop-color="#0e111a"/>
      <stop offset="100%" stop-color="#07080d"/>
    </radialGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4d0"/>
      <stop offset="50%" stop-color="#e3b342"/>
      <stop offset="100%" stop-color="#b0811e"/>
    </linearGradient>

    <linearGradient id="anemoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7cf8db"/>
      <stop offset="100%" stop-color="#38c3a1"/>
    </linearGradient>

    <linearGradient id="electroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#df9ffc"/>
      <stop offset="100%" stop-color="#a45cd9"/>
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle App Chassis (Android Material / iOS shape) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="rgba(227, 179, 66, 0.4)" stroke-width="6"/>
  <rect x="28" y="28" width="456" height="456" rx="100" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2"/>

  <!-- Celestial Constellation Orbit Rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(227, 179, 66, 0.15)" stroke-width="1.5" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="115" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Dual Travelers Resonance Nodes (Anemo & Electro) -->
  <circle cx="160" cy="180" r="14" fill="url(#anemoGrad)" filter="url(#goldGlow)"/>
  <circle cx="352" cy="332" r="14" fill="url(#electroGrad)" filter="url(#goldGlow)"/>
  
  <!-- Intertwined Resonance Arc -->
  <path d="M160 180 C 210 160, 300 270, 352 332" fill="none" stroke="rgba(227, 179, 66, 0.3)" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Central Teyvat Primogem Celestial Star -->
  <path d="M 256,96 
           C 256,190 276,210 370,210 
           C 276,210 256,230 256,324 
           C 256,230 236,210 142,210 
           C 236,210 256,190 256,96 Z"
        fill="url(#goldGrad)"
        filter="url(#goldGlow)"/>

  <!-- Lower Diamond Accent -->
  <polygon points="256,360 270,380 256,400 242,380" fill="url(#goldGrad)"/>
  
  <!-- Subtle Filigree Diamonds -->
  <polygon points="120,256 128,266 120,276 112,266" fill="rgba(227, 179, 66, 0.4)"/>
  <polygon points="392,256 400,266 392,276 384,266" fill="rgba(227, 179, 66, 0.4)"/>
</svg>
